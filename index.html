<script>
const PEOPLE=['jo','tu','ell/ella','nosaltres','vosaltres','ells/elles'];
const PERSON_HINT=['yo','tú','él/ella','nosotros/as','vosotros/as','ellos/as'];

const TENSES={
  present:'Present',
  imperfect:'Imperfet',
  future:'Futur',
  conditional:'Condicional',
  past:'Passat perifràstic'
};

const VERBS={
  parlar:{
    es:'hablar',
    present:['parlo','parles','parla','parlem','parleu','parlen'],
    imperfect:['parlava','parlaves','parlava','parlàvem','parlàveu','parlaven'],
    future:['parlaré','parlaràs','parlarà','parlarem','parlareu','parlaran'],
    conditional:['parlaria','parlaries','parlaria','parlaríem','parlaríeu','parlarien'],
    past:['vaig parlar','vas parlar','va parlar','vam parlar','vau parlar','van parlar']
  },

  tenir:{
    es:'tener',
    present:['tinc','tens','té','tenim','teniu','tenen'],
    imperfect:['tenia','tenies','tenia','teníem','teníeu','tenien'],
    future:['tindré','tindràs','tindrà','tindrem','tindreu','tindran'],
    conditional:['tindria','tindries','tindria','tindríem','tindríeu','tindrien'],
    past:['vaig tenir','vas tenir','va tenir','vam tenir','vau tenir','van tenir']
  },

  fer:{
    es:'hacer',
    present:['faig','fas','fa','fem','feu','fan'],
    imperfect:['feia','feies','feia','fèiem','fèieu','feien'],
    future:['faré','faràs','farà','farem','fareu','faran'],
    conditional:['faria','faries','faria','faríem','faríeu','farien'],
    past:['vaig fer','vas fer','va fer','vam fer','vau fer','van fer']
  },

  anar:{
    es:'ir',
    present:['vaig','vas','va','anem','aneu','van'],
    imperfect:['anava','anaves','anava','anàvem','anàveu','anaven'],
    future:['aniré','aniràs','anirà','anirem','anireu','aniran'],
    conditional:['aniria','aniries','aniria','aniríem','aniríeu','anirien'],
    past:['vaig anar','vas anar','va anar','vam anar','vau anar','van anar']
  },

  ser:{
    es:'ser',
    present:['soc','ets','és','som','sou','són'],
    imperfect:['era','eres','era','érem','éreu','eren'],
    future:['seré','seràs','serà','serem','sereu','seran'],
    conditional:['seria','series','seria','seríem','seríeu','serien'],
    past:['vaig ser','vas ser','va ser','vam ser','vau ser','van ser']
  },

  estar:{
    es:'estar',
    present:['estic','estàs','està','estem','esteu','estan'],
    imperfect:['estava','estaves','estava','estàvem','estàveu','estaven'],
    future:['estaré','estaràs','estarà','estarem','estareu','estaran'],
    conditional:['estaria','estaries','estaria','estaríem','estaríeu','estarien'],
    past:['vaig estar','vas estar','va estar','vam estar','vau estar','van estar']
  },

  poder:{
    es:'poder',
    present:['puc','pots','pot','podem','podeu','poden'],
    imperfect:['podia','podies','podia','podíem','podíeu','podien'],
    future:['podré','podràs','podrà','podrem','podreu','podran'],
    conditional:['podria','podries','podria','podríem','podríeu','podrien'],
    past:['vaig poder','vas poder','va poder','vam poder','vau poder','van poder']
  },

  voler:{
    es:'querer',
    present:['vull','vols','vol','volem','voleu','volen'],
    imperfect:['volia','volies','volia','volíem','volíeu','volien'],
    future:['voldré','voldràs','voldrà','voldrem','voldreu','voldran'],
    conditional:['voldria','voldries','voldria','voldríem','voldríeu','voldrien'],
    past:['vaig voler','vas voler','va voler','vam voler','vau voler','van voler']
  }
};


/* =========================================================
   BANCO DE CONJUGACIONES
========================================================= */

const ITEMS=[];

for(const v in VERBS){
  for(const t in TENSES){
    for(let i=0;i<6;i++){
      ITEMS.push({
        id:v+'|'+t+'|'+i,
        v:v,
        t:t,
        i:i,
        answer:VERBS[v][t][i]
      });
    }
  }
}


/* =========================================================
   DATOS DEL JUGADOR
========================================================= */

let data=JSON.parse(
  localStorage.getItem('cvbData')||'null'
)||{
  xp:0,
  correct:0,
  wrong:0,
  bestStreak:0,
  streak:0,
  mastery:{},
  seen:{},
  mistakes:{}
};


/* =========================================================
   ESTADO DEL JUEGO
========================================================= */

let state={
  mode:null,
  current:null,
  queue:[],
  index:0,
  score:0,
  lives:3,
  deadline:0,
  interval:null,

  kTimer:null,
  kIndex:0,
  kScore:0,
  kCombo:0,
  kQuestions:[],
  kAnswered:false
};


/* =========================================================
   GUARDAR / CABECERA
========================================================= */

function save(){

  localStorage.setItem(
    'cvbData',
    JSON.stringify(data)
  );

  updateHeader();
}


function updateHeader(){

  document.getElementById('xp').textContent=data.xp;

  document.getElementById('streak').textContent=data.streak;

  document.getElementById('level').textContent=
    Math.floor(data.xp/100)+1;
}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function screen(id){

  document
    .querySelectorAll('.screen')
    .forEach(x=>x.classList.remove('active'));

  document
    .getElementById(id)
    .classList.add('active');
}


function goMenu(){

  clearTimers();

  screen('menu');

  updateHeader();
}


function clearTimers(){

  if(state.interval)
    clearInterval(state.interval);

  if(state.kTimer)
    clearInterval(state.kTimer);

  state.interval=null;
  state.kTimer=null;
}


/* =========================================================
   NORMALIZACIÓN
========================================================= */

function norm(s){

  return s
    .trim()
    .toLowerCase()
    .normalize('NFC')
    .replace(/\s+/g,' ');
}


/* =========================================================
   MAESTRÍA
========================================================= */

function mastery(item){

  return data.mastery[item.id]??0;
}


/* =========================================================
   ALGORITMO ADAPTATIVO
========================================================= */

function weightedItem(){

  let pool=ITEMS.map(x=>{

    let m=mastery(x);

    let mistakes=
      data.mistakes[x.id]||0;

    let seen=
      data.seen[x.id]||0;

    /*
      Cuanto menor sea la maestría,
      mayor será el peso.

      Cuantos más errores,
      mayor será el peso.

      Cuantas más veces aparezca,
      ligeramente se reduce.
    */

    let weight=
      (1+(100-m)/15)*
      (1+mistakes*0.7)/
      (1+seen*0.04);

    return [x,weight];

  });


  let total=
    pool.reduce(
      (a,b)=>a+b[1],
      0
    );


  let r=
    Math.random()*total;


  for(const [x,w] of pool){

    r-=w;

    if(r<=0)
      return x;

  }


  return ITEMS[
    Math.floor(
      Math.random()*ITEMS.length
    )
  ];
}


/* =========================================================
   REGISTRAR RESPUESTA
========================================================= */

function record(item,ok){

  data.seen[item.id]=
    (data.seen[item.id]||0)+1;


  if(ok){

    data.correct++;


    data.mastery[item.id]=
      Math.min(
        100,
        mastery(item)+12
      );


    data.xp+=
      10+
      Math.min(
        20,
        data.streak*2
      );


    data.streak++;


    data.bestStreak=
      Math.max(
        data.bestStreak,
        data.streak
      );

  }else{

    data.wrong++;


    data.mistakes[item.id]=
      (data.mistakes[item.id]||0)+1;


    data.mastery[item.id]=
      Math.max(
        0,
        mastery(item)-9
      );


    data.streak=0;
  }


  save();
}


/* =========================================================
   MODOS NORMALES
========================================================= */

function startNormal(mode){

  clearTimers();


  state={
    ...state,
    mode:mode,
    index:0,
    score:0,
    lives:mode==='survival'?3:Infinity,
    deadline:0
  };


  screen('game');


  document.getElementById(
    'modeLabel'
  ).textContent=
    mode==='adaptive'
      ?'🧠 ENTRENAMIENTO ADAPTATIVO'
      :mode==='blitz'
        ?'⚡ CONTRARRELOJ · 60 S'
        :'❤️ SUPERVIVENCIA · 3 VIDAS';


  document.getElementById(
    'lives'
  ).textContent=
    mode==='survival'
      ?3
      :'∞';


  document.getElementById(
    'feedback'
  ).textContent='';


  if(mode==='blitz'){

    state.deadline=
      Date.now()+60000;


    state.interval=
      setInterval(()=>{

        let left=
          Math.max(
            0,
            state.deadline-Date.now()
          );


        document.getElementById(
          'timer'
        ).textContent=
          Math.ceil(left/1000)+'s';


        if(!left)
          finishNormal();

      },100);

  }else{

    document.getElementById(
      'timer'
    ).textContent='';

  }


  nextNormal();
}


function nextNormal(){

  if(
    state.mode==='blitz' &&
    Date.now()>=state.deadline
  ){

    return finishNormal();

  }


  state.current=
    weightedItem();


  state.index++;


  let x=state.current;


  document.getElementById(
    'prompt'
  ).textContent=
    VERBS[x.v].es+
    ' · '+
    TENSES[x.t]+
    ' · '+
    PERSON_HINT[x.i];


  document.getElementById(
    'question'
  ).textContent=
    x.v;


  document.getElementById(
    'meaning'
  ).textContent=
    'Escribe la forma correcta en catalán.';


  document.getElementById(
    'progress'
  ).style.width=
    (
      state.mode==='blitz'
        ?'100%'
        :Math.min(
          100,
          state.index/20*100
        )+'%'
    );


  document.getElementById(
    'answer'
  ).value='';


  document.getElementById(
    'answer'
  ).focus();
}


function submitAnswer(){

  if(!state.current)
    return;


  let inp=
    document.getElementById('answer');


  let val=
    norm(inp.value);


  if(!val)
    return;


  let ok=
    val===norm(
      state.current.answer
    );


  record(
    state.current,
    ok
  );


  let fb=
    document.getElementById(
      'feedback'
    );


  fb.className=
    'feedback '+
    (ok?'good':'bad');


  fb.textContent=
    ok
      ?'✓ Correcte! +XP'
      :'✗ Era: '+state.current.answer;


  if(
    !ok &&
    state.mode==='survival'
  ){

    state.lives--;


    document.getElementById(
      'lives'
    ).textContent=
      state.lives;


    if(state.lives<=0){

      return setTimeout(
        finishNormal,
        500
      );

    }

  }


  state.score+=
    ok?1:0;


  if(
    state.mode!=='blitz' &&
    state.index>=20
  ){

    return setTimeout(
      finishNormal,
      500
    );

  }


  setTimeout(
    nextNormal,
    260
  );
}


function finishNormal(){

  clearTimers();

  screen('result');


  document.getElementById(
    'resultMode'
  ).textContent=
    document.getElementById(
      'modeLabel'
    ).textContent;


  let total=
    state.mode==='blitz'
      ?state.index
      :state.index;


  let pct=
    total
      ?Math.round(
        state.score/total*100
      )
      :0;


  document.getElementById(
    'resultScore'
  ).textContent=
    state.score+' ✓';


  document.getElementById(
    'resultTitle'
  ).textContent=
    pct>=80
      ?'🔥 Brutal. Vas molt bé.'
      :pct>=60
        ?'💪 Bon treball.'
        :'🧠 A seguir entrenant.';


  document.getElementById(
    'resultText'
  ).textContent=
    'Aciertos: '+
    state.score+
    ' de '+
    total+
    ' · Precisión: '+
    pct+
    '% · Racha actual: '+
    data.streak;
}


/* =========================================================
   CONFIGURACIÓN DE DESAFÍOS
========================================================= */

function fillSelects(){

  let sv=
    document.getElementById(
      'setupVerb'
    );

  let st=
    document.getElementById(
      'setupTense'
    );


  sv.innerHTML=
    Object.keys(VERBS)
      .map(v=>
        `<option value="${v}">
          ${v} — ${VERBS[v].es}
        </option>`
      )
      .join('');


  st.innerHTML=
    Object.entries(TENSES)
      .map(([k,v])=>
        `<option value="${k}">
          ${v}
        </option>`
      )
      .join('');
}


function openTenseSetup(){

  state.challengeType='tense';

  fillSelects();


  document.getElementById(
    'setupTitle'
  ).textContent=
    '⏱️ DOMINA UN TIEMPO';


  document.getElementById(
    'setupTense'
  ).disabled=false;


  screen('setup');
}


function openVerbSetup(){

  state.challengeType='verb';

  fillSelects();


  document.getElementById(
    'setupTitle'
  ).textContent=
    '📚 DOMINA UN VERBO';


  document.getElementById(
    'setupTense'
  ).disabled=true;


  screen('setup');
}


function beginChallenge(){

  let v=
    document.getElementById(
      'setupVerb'
    ).value;


  let t=
    document.getElementById(
      'setupTense'
    ).value;


  state.challengeV=v;

  state.challengeT=t;


  renderChallenge();


  screen('challenge');
}


function renderChallenge(){

  let v=state.challengeV;

  let t=state.challengeT;

  let grid=
    document.getElementById(
      'challengeGrid'
    );


  grid.innerHTML='';


  if(
    state.challengeType==='tense'
  ){

    document.getElementById(
      'challengeMode'
    ).textContent=
      '⏱️ 6 CONJUGACIONES';


    document.getElementById(
      'challengeTitle'
    ).textContent=
      v+' · '+TENSES[t];


    let html=
      '<div class="challenge-group">'+
      '<h4>'+
      TENSES[t]+
      ' · '+
      v+
      '</h4>';


    for(let i=0;i<6;i++)
      html+=
        personInput(
          v,
          t,
          i
        );


    html+='</div>';


    grid.innerHTML=html;

  }else{

    document.getElementById(
      'challengeMode'
    ).textContent=
      '📚 30 CONJUGACIONES';


    document.getElementById(
      'challengeTitle'
    ).textContent=
      v+
      ' · '+
      VERBS[v].es;


    grid.innerHTML=
      Object.keys(TENSES)
        .map(t=>
          `<div class="challenge-group">
            <h4>${TENSES[t]}</h4>
            ${
              [0,1,2,3,4,5]
                .map(i=>
                  personInput(v,t,i)
                )
                .join('')
            }
          </div>`
        )
        .join('');
  }
}


function personInput(v,t,i){

  return `
    <div class="person">

      <label>
        ${PERSON_HINT[i]}
        <br>
        <span>${PEOPLE[i]}</span>
      </label>

      <input
        data-v="${v}"
        data-t="${t}"
        data-i="${i}"
        autocomplete="off"
        placeholder="Català..."
      >

    </div>
  `;
}


function checkChallenge(){

  let inputs=
    [
      ...document.querySelectorAll(
        '#challengeGrid input'
      )
    ];


  let ok=0;


  inputs.forEach(inp=>{

    let x=
      VERBS[inp.dataset.v];


    let ans=
      x[
        inp.dataset.t
      ][
        +inp.dataset.i
      ];


    let good=
      norm(inp.value)===norm(ans);


    if(good){

      ok++;


      inp.style.borderColor=
        'var(--green)';


      inp.style.background=
        '#10251b';

    }else{

      inp.style.borderColor=
        'var(--red)';


      inp.style.background=
        '#28131a';


      inp.value=ans;
    }


    record(
      ITEMS.find(z=>
        z.v===inp.dataset.v &&
        z.t===inp.dataset.t &&
        z.i==+inp.dataset.i
      ),
      good
    );

  });


  let pct=
    Math.round(
      ok/inputs.length*100
    );


  let feedback=
    document.getElementById(
      'challengeFeedback'
    );


  feedback.className=
    'feedback '+
    (pct>=70?'good':'bad');


  feedback.textContent=
    `${ok}/${inputs.length} correctas · ${pct}% · Las rojas muestran la respuesta correcta.`;


  if(pct===100)
    data.xp+=50;


  save();
}


/* =========================================================
   KAHOOT
========================================================= */

function startKahoot(){

  clearTimers();


  state.kIndex=0;

  state.kScore=0;

  state.kCombo=0;

  state.kAnswered=false;


  /*
    Generamos 15 preguntas.
    El algoritmo adaptativo decide
    cuáles tienen más probabilidad
    de aparecer.
  */

  state.kQuestions=
    Array.from(
      {length:15},
      ()=>weightedItem()
    );


  screen('kahoot');


  nextKahoot();
}


/* =========================================================
   SIGUIENTE PREGUNTA KAHOOT
========================================================= */

function nextKahoot(){

  if(
    state.kIndex>=
    state.kQuestions.length
  ){

    return finishKahoot();

  }


  let item=
    state.kQuestions[
      state.kIndex
    ];


  state.kIndex++;


  let correct=
    item.answer;


  /*
    Creamos las 4 respuestas.

    IMPORTANTE:
    - La correcta se mete primero.
    - Las otras 3 se buscan aleatoriamente.
    - Nunca puede haber una duplicada.
  */

  let options=
    new Set();


  options.add(correct);


  let safety=0;


  while(
    options.size<4 &&
    safety<500
  ){

    safety++;


    let randomItem=
      ITEMS[
        Math.floor(
          Math.random()*
          ITEMS.length
        )
      ];


    let candidate=
      randomItem.answer;


    if(
      norm(candidate)!==
      norm(correct)
    ){

      options.add(candidate);

    }

  }


  /*
    En caso extremo, rellenamos
    con respuestas únicas.
  */

  if(options.size<4){

    for(
      const candidateItem of ITEMS
    ){

      if(
        options.size>=4
      )
        break;


      if(
        norm(candidateItem.answer)!==
        norm(correct)
      ){

        options.add(
          candidateItem.answer
        );

      }

    }

  }


  let opts=
    [...options]
      .sort(
        ()=>Math.random()-.5
      );


  state.kAnswered=false;


  document.getElementById(
    'kVerb'
  ).textContent=
    `${item.v} · ${TENSES[item.t]} · ${PERSON_HINT[item.i]} · “${VERBS[item.v].es}”`;


  document.getElementById(
    'kQuestion'
  ).textContent=
    'Quina és la forma correcta?';


  document.getElementById(
    'kMeaning'
  ).textContent=
    'Escoge una de las cuatro respuestas.';


  document.getElementById(
    'kCombo'
  ).textContent=
    state.kCombo;


  document.getElementById(
    'kProgress'
  ).style.width=
    (
      state.kIndex/
      state.kQuestions.length*
      100
    )+'%';


  document.getElementById(
    'kFeedback'
  ).textContent='';


  let wrap=
    document.getElementById(
      'answers'
    );


  /*
    AQUÍ ESTÁ LA CORRECCIÓN IMPORTANTE.

    En vez de meter toda la función
    answerKahoot() dentro del onclick,
    creamos los botones y después
    les añadimos un eventListener.

    Así los 4 botones son realmente
    interactivos.
  */

  wrap.innerHTML=
    opts
      .map((option,i)=>{

        return `
          <button
            class="ans ${['a','b','c','d'][i]}"
            data-answer="${encodeURIComponent(option)}"
            type="button"
          >
            ${option}
          </button>
        `;

      })
      .join('');


  /*
    Activamos cada botón.
  */

  wrap
    .querySelectorAll('.ans')
    .forEach(button=>{

      button.addEventListener(
        'click',
        ()=>{
          answerKahoot(button,false);
        }
      );

    });


  /*
    Temporizador de 10 segundos.
  */

  let left=10;


  document.getElementById(
    'kTimer'
  ).textContent=left;


  state.kTimer=
    setInterval(()=>{

      left--;


      document.getElementById(
        'kTimer'
      ).textContent=left;


      if(left<=0){

        clearInterval(
          state.kTimer
        );


        state.kTimer=null;


        /*
          null = no se ha seleccionado
          ninguna respuesta.
        */

        answerKahoot(
          null,
          true
        );

      }

    },1000);
}


/* =========================================================
   RESPUESTA KAHOOT
========================================================= */

function answerKahoot(
  btn,
  timeout=false
){

  /*
    IMPIDE DOBLE CLICK.

    Antes podía pasar que una persona
    hiciera dos clicks muy rápidos
    y el juego registrara dos respuestas.
  */

  if(state.kAnswered)
    return;


  state.kAnswered=true;


  /*
    Paramos el cronómetro.
  */

  if(state.kTimer){

    clearInterval(
      state.kTimer
    );

    state.kTimer=null;
  }


  /*
    Recuperamos la pregunta actual.
  */

  let item=
    state.kQuestions[
      state.kIndex-1
    ];


  let correct=
    item.answer;


  /*
    Recuperamos la respuesta
    seleccionada.
  */

  let chosen='';


  if(btn){

    chosen=
      decodeURIComponent(
        btn.dataset.answer
      );

  }


  let ok=
    norm(chosen)===
    norm(correct);


  /*
    Guardamos el resultado
    en el sistema adaptativo.
  */

  record(
    item,
    ok
  );


  /*
    Bloqueamos TODOS los botones.
  */

  document
    .querySelectorAll('.ans')
    .forEach(button=>{

      button.classList.add(
        'disabled'
      );

    });


  /*
    MARCAMOS SIEMPRE LA CORRECTA
    EN VERDE.

    Esto permite al jugador aprender
    incluso cuando falla.
  */

  document
    .querySelectorAll('.ans')
    .forEach(button=>{

      let value=
        decodeURIComponent(
          button.dataset.answer
        );


      if(
        norm(value)===
        norm(correct)
      ){

        button.classList.add(
          'correct'
        );

      }

    });


  if(ok){

    /*
      Acierto:
      aumenta combo y puntos.
    */

    state.kCombo++;


    let points=
      100+
      Math.min(
        500,
        state.kCombo*50
      );


    state.kScore+=points;


    if(btn){

      btn.classList.add(
        'correct'
      );

    }


    document.getElementById(
      'kFeedback'
    ).className=
      'feedback good';


    document.getElementById(
      'kFeedback'
    ).textContent=
      '✓ Correcte! +'+
      points+
      ' punts';

  }else{

    /*
      Error:
      el combo vuelve a cero.
    */

    state.kCombo=0;


    if(btn){

      btn.classList.add(
        'wrong'
      );

    }


    document.getElementById(
      'kFeedback'
    ).className=
      'feedback bad';


    document.getElementById(
      'kFeedback'
    ).textContent=
      timeout
        ?'⏰ Temps! Era: '+correct
        :'✗ Incorrecte! Era: '+correct;
  }


  document.getElementById(
    'kCombo'
  ).textContent=
    state.kCombo;


  /*
    Dejamos 0.9 s para que el jugador
    vea la respuesta antes de pasar
    a la siguiente.
  */

  setTimeout(
    nextKahoot,
    900
  );
}


/* =========================================================
   FINAL KAHOOT
========================================================= */

function finishKahoot(){

  clearTimers();


  screen('result');


  document.getElementById(
    'resultMode'
  ).textContent=
    '🏆 KAHOOT · BATALLA';


  document.getElementById(
    'resultScore'
  ).textContent=
    state.kScore;


  document.getElementById(
    'resultTitle'
  ).textContent=
    state.kScore>=3500
      ?'👑 ¡CAMPEÓN!'
      :state.kScore>=2000
        ?'🔥 Muy buena partida'
        :'💪 Sube tu combo';


  document.getElementById(
    'resultText'
  ).textContent=
    '15 preguntas · Cada acierto aumenta el combo y la puntuación.';
}


/* =========================================================
   ESTADÍSTICAS
========================================================= */

function showStats(){

  clearTimers();


  screen('stats');


  let lvl=
    Math.floor(
      data.xp/100
    )+1;


  document.getElementById(
    'statsLevel'
  ).textContent=
    'Nivel '+lvl;


  document.getElementById(
    'sXP'
  ).textContent=
    data.xp;


  document.getElementById(
    'sCorrect'
  ).textContent=
    data.correct;


  document.getElementById(
    'sWrong'
  ).textContent=
    data.wrong;


  document.getElementById(
    'sBest'
  ).textContent=
    data.bestStreak;


  let body=
    document.getElementById(
      'statsBody'
    );


  body.innerHTML=
    ITEMS

      .map(x=>({
        x:x,
        m:mastery(x),
        e:data.mistakes[x.id]||0
      }))

      .sort(
        (a,b)=>a.m-b.m
      )

      .slice(0,20)

      .map(o=>`

        <tr>

          <td>
            ${o.x.v}
            ·
            ${TENSES[o.x.t]}
            ·
            ${PERSON_HINT[o.x.i]}
          </td>

          <td>

            ${o.m}%

            <div class="bar">
              <i style="width:${o.m}%"></i>
            </div>

          </td>

          <td>
            ${o.e}
          </td>

        </tr>

      `)

      .join('');
}


/* =========================================================
   BORRAR PROGRESO
========================================================= */

function resetData(){

  if(
    confirm(
      '¿Borrar todo el progreso?'
    )
  ){

    data={
      xp:0,
      correct:0,
      wrong:0,
      bestStreak:0,
      streak:0,
      mastery:{},
      seen:{},
      mistakes:{}
    };


    save();


    showStats();
  }
}

   INICIO
========================================================= */

fillSelects();

updateHeader();
